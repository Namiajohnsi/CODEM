<!DOCTYPE html>
<html>
<body>

<h2>Password Strength Validator</h2>

<button onclick="checkPasswordStrength('Abc123')">Check Password</button>

<script>
function checkPasswordStrength(password) {
    let strength;

    if (password.length < 6) strength = "Weak";
    else if (/[A-Z]/.test(password) && /[0-9]/.test(password))
        strength = "Strong";
    else strength = "Medium";

    alert("Strength: " + strength);
}
</script>

</body>
</html>
