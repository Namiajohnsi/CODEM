<!DOCTYPE html>
<head>
    <title>Advanced function operations</title>
</head>
<body>
    <script>
        function CalculateSum(a, b) {
            return a + b;
        }
        function CalculateProduct(a, b) {
            return a * b;
        }
        let sum=CalculateSum(4,7);
        let product=CalculateProduct(5,11);
        console.log("The sum is:"+sum);
        console.log("The product is:"+product);
    </script>

</body>
