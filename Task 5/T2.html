<!DOCTYPE html>
<head>
<title>
    Function expression and arrow functions

</title>
</head>
<body>
    <script>
        let lengthofstring=function(str){
            return str.length;
        }
        let squarenum=(num)=>{
            return num*num;
        }
        let reslength=lengthofstring("Function Expression");
        let ressquare=squarenum(4);
        console.log("The length of string is "+reslength);
        console.log("The square is "+ressquare);
    </script>
</body>
