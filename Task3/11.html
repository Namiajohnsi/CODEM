<!DOCTYPE html>
<html>
<head>
<title>Task 11</title>
</head>
<body>

<button class="action">Button 1</button>
<button class="action">Button 2</button>
<button class="action">Button 3</button>

<p id="output"></p>

<script>
let buttons = document.querySelectorAll(".action");
let output = document.getElementById("output");

buttons.forEach(function(btn) {
    btn.addEventListener("click", function(event) {
        output.textContent =
        `Clicked: ${event.target.textContent}, Event Type: ${event.type}`;
    });
});
</script>

</body>
</html>
