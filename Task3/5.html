<!DOCTYPE html>
<html>
<head>
<title>Task 6</title>
</head>
<body>

<h2 id="mainHeading">Welcome</h2>
<p class="info">Paragraph 1</p>
<p class="info">Paragraph 2</p>

<script>
let heading = document.getElementById("mainHeading");
let paragraphs = document.getElementsByClassName("info");
let firstPara = document.querySelector(".info");

heading.textContent = "Updated Heading";
heading.style.color = "blue";
heading.style.fontSize = "30px";

for (let p of paragraphs) {
    p.textContent = "Updated Text";
    p.style.backgroundColor = "lightgray";
    p.style.padding = "5px";
}

firstPara.style.border = "2px solid black";
</script>

</body>
</html>
