<!DOCTYPE html>
<html>
<body>

<h2>Message Intent Detection</h2>

<button onclick="detectIntent('Why is this not working?')">Check Intent</button>

<script>
function detectIntent(message) {
    if (!message.trim()) {
        console.log("Invalid message");
        return;
    }

    let isQuestion = message.includes("?");
    let isComplaint = message.includes("problem") ||
                      message.includes("not working");

    let intent;

    if (isQuestion && isComplaint) intent = "Urgent request";
    else if (isComplaint) intent = "Complaint";
    else if (isQuestion) intent = "Question";
    else intent = "Other";

    console.log("Intent:", intent);
}
</script>

</body>
</html>
